[pytest]
# Run ALL offline tests (incl. memory-heavy export/pyshacl), memory-safe: --forked runs each test in
# its own subprocess (serially), so peak memory stays at ~one test's worth and a runaway test dies
# alone instead of OOM-killing the whole run/box. Integration tests need a live Chemotion server, so
# they are excluded by default (add them with -m integration when a server is configured).
#   - Include live tests (needs a server):  pytest -m integration
#   - Skip the fork overhead (fast, single process; only safe once memory is known-bounded);
#     addopts must be overridden too, since it carries the --forked flag:
#         pytest -q -o addopts='-m "not integration"'
addopts = -m "not integration" --forked
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
# Live CLI logging at DEBUG floods memory (rdflib/linkml/urllib3) and can OOM constrained runs.
# Keep logs off by default; raise with `--log-cli-level=DEBUG` when debugging a specific test.
log_cli = false
log_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: requires a live Chemotion server/DB (deselect with -m "not integration")
    heavy: memory-heavy offline test (full RO-Crate export serialization or pyshacl validation); run individually
