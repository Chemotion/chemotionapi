stages:
  - build

variables:
  POETRY_VERSION: "2.1.1"        # change if needed
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

build_package:
  stage: build
  image: python:3.13
  before_script:
    - pip install --no-cache-dir poetry==$POETRY_VERSION
    # Disable virtualenv creation so Poetry installs in system env during CI
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-root
  script:
    - poetry build
  artifacts:
    when: always
    paths:
      - dist/*
