name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  static:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # --frozen: fail rather than silently re-resolve if uv.lock and pyproject.toml disagree.
      - name: Install dependencies (locked)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: just lint

      # Whole-tree check. Modules with pre-existing errors are exempted via
      # [[tool.mypy.overrides]] in pyproject.toml; that list only ever shrinks.
      - name: Type check (mypy)
        run: just mypy

  test:
    name: offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-groups

      # Integration tests are deselected by tests/pytest.ini (addopts -m "not integration") since
      # they need a live Chemotion server; they run against the dockerized stack via
      # `just test-integration`, not here.
      - name: Offline tests
        run: just test

  # Release artefacts only: a wheel is worth building when we are actually cutting a version,
  # not on every merge. Tag pushes only — skipped for branch pushes and pull requests.
  build:
    name: build sdist + wheel
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Import the built package
        run: |
          uv run --no-project --with dist/*.whl python -c \
            "import chemotion_api; print('import OK')"

# NOTE: the integration suite is not run here. It needs a live Chemotion ELN v4 stack
# (tests/test_config/compose.yml, digest-pinned) and a reseeded database, which is a ~2 GB pull —
# too heavy for every push. Run it locally with `just test-integration`.
