name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: mypy + offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project targets Python >= 3.14 only (see requires-python / .python-version).
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      # Same gate as local development: ruff (pyupgrade) + mypy + the full offline suite
      # (memory-safe --forked defaults from pytest.ini; integration tests are
      # excluded here — they run nightly/on-demand via integration.yml).
      - name: just check
        run: just check

      # Offline-suite coverage: gated by fail_under in pyproject ([tool.coverage.report]).
      - name: Coverage
        run: |
          just cov
          echo "## Offline-suite coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docs:
    name: build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # The runtime stack is mocked in docs/conf.py, so only the docs group is needed.
      - name: Build Sphinx docs
        run: just docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
