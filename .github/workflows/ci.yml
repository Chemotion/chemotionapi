name: CI

on:
  push:
    branches: [main]
    # Release tags only. The repo also carries non-release tags (0.3.x from the old history,
    # and backup refs), and every tag that matches here reaches the publish job below.
    tags: ['v*']
  pull_request:

jobs:
  static:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      # --frozen: fail rather than silently re-resolve if uv.lock and pyproject.toml disagree.
      - name: Install dependencies (locked)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: just lint

      # Whole-tree check. Modules with pre-existing errors are exempted via
      # [[tool.mypy.overrides]] in pyproject.toml; that list only ever shrinks.
      - name: Type check (mypy)
        run: just mypy

  test:
    name: offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-groups

      # Integration tests are deselected by tests/pytest.ini (addopts -m "not integration") since
      # they need a live Chemotion server; they run against the dockerized stack via
      # `just test-integration`, not here.
      - name: Offline tests
        run: just test

  # Exported .eln archives must stay RO-Crate 1.1 conformant. This is a real regression risk, not a
  # formality: a change to the metadata graph once silently broke ontology_patch while every unit
  # test still passed, because the tests asserted our own shape rather than the spec's.
  #
  # Two stages in two Pythons on purpose — roc-validator's dependencies cannot build on 3.14, and
  # the client requires 3.14 — so the crate is exported by the project env and validated by a
  # throwaway 3.13 env. No Chemotion server needed: the crate is built from a committed fixture
  # through the offline ingester.
  build:
    name: build sdist + wheel
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Fail here, loudly, rather than at upload. PyPI rejects a re-upload of an existing
      # version, so a tag that does not match pyproject.toml otherwise dies several minutes
      # later with "File already exists" — which reads like a PyPI problem, not a tagging one.
      - name: Tag must match the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match pyproject version '${version}'"
            echo "Retag, or correct the version, so the two agree before releasing."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${version}"

      - name: Build
        run: uv build

      - name: Import the built package
        run: |
          uv run --no-project --with dist/*.whl python -c \
            "import chemotion_api; print('import OK')"

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # PyPI trusted publishing (OIDC): no API token is stored anywhere. PyPI only accepts the
  # upload if chemotion-api lists this repo, this workflow file (ci.yml) and the `pypi`
  # environment as a trusted publisher. Runs only once lint, types and tests have passed.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [static, test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chemotion-api/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

# NOTE: the integration suite is not run here. It needs a live Chemotion ELN v4 stack
# (tests/test_config/compose.yml, digest-pinned) and a reseeded database, which is a ~2 GB pull —
# too heavy for every push. Run it locally with `just test-integration`.
