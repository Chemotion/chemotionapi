services:

  dbupgrade:
    image: ptrxyz/chemotion:dbupgrade-2.1.1
    volumes:
      - chemotion_db:/var/lib/postgresql/data/
    restart: "no"
  db:
    image: ptrxyz/chemotion:db-2.1.1
    restart: unless-stopped
    hostname: db
    ports:
    - 54320:5432
    depends_on:
      dbupgrade:
        condition: service_completed_successfully
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
    - chemotion_db:/var/lib/postgresql/data/
    networks:
    - chemotion
  msconvert:
    image: ptrxyz/chemotion:msconvert-2.1.1
    restart: unless-stopped
    hostname: msconvert
    volumes:
    - spectra:/shared:rw
    networks:
    - chemotion
  spectra:
    image: ptrxyz/chemotion:spectra-2.1.1
    restart: unless-stopped
    hostname: spectra
    volumes:
    - spectra:/shared:rw
    depends_on:
    - msconvert
    networks:
    - chemotion
  worker:
    image: ptrxyz/chemotion:eln-2.1.1
    restart: unless-stopped
    environment:
    - CONFIG_ROLE=worker
    - SECRET_KEY_BASE=3b4576cc0m927897n56v
    - PUBLIC_URL=https://chemotion.knmf.kit.edu
    depends_on:
    - db
    - eln
    - spectra
    volumes:
    - chemotion_data:/chemotion/data/
    - chemotion_app:/chemotion/app
    networks:
    - chemotion
  eln:
    image: ptrxyz/chemotion:eln-2.1.1
    restart: unless-stopped
    env_file: .env
    environment:
    - CONFIG_ROLE=eln
    - SECRET_KEY_BASE=3b4576cc0m927897n56v
    - PUBLIC_URL=http://0.0.0.0:3579
    depends_on:
    - db
    - spectra
    volumes:
    - ./shared/pullin:/shared
    - ./shared/backup:/backup
    - chemotion_data:/chemotion/data/
    - chemotion_app:/chemotion/app
    ports:
    - 3579:4000
    networks:
    - chemotion
  ketchersvc:
    image: ptrxyz/chemotion:ketchersvc-2.1.1
    restart: unless-stopped
    init: true
    environment:
    - STARTUPDELAY=30
    - CONFIG_KETCHER_URL=http://eln:4000/ketcher/
    depends_on:
      eln:
        condition: service_healthy
    networks:
    - chemotion
  knmfproposalminer:
    image: mstarman/knmfproposalminer:0.1.9
    env_file:
    - .env
    volumes:
      - knmfproposalminer:/srv/app
    networks:
    - chemotion
  converter:
    image: ptrxyz/chemotion:converter-2.1.1
    restart: unless-stopped
    environment:
    - SECRET_KEY=3b4576cc0m927897n56v
    volumes:
    - ./services/converter/profiles:/srv/chemotion/profiles
    - ./services/converter/datasets:/srv/chemotion/datasets
    - ./services/converter/htpasswd:/srv/chemotion/htpasswd
    networks:
    - chemotion
volumes:
  knmfproposalminer:
  chemotion_app:
    name: chemotion_app
  chemotion_data:
    name: chemotion_data
  chemotion_db:
    name: chemotion_db
  spectra:
    name: chemotion_spectra
networks:
  chemotion: null
