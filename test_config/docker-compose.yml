services:
  db:
    image: postgres:14
    restart: unless-stopped
    hostname: db
    ports:
      - 54320:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - chemotion_db:/var/lib/postgresql/data/
    networks:
      - chemotion
  msconvert:
    image: ptrxyz/chemotion:msconvert-1.9.3
    restart: unless-stopped
    hostname: msconvert
    volumes:
      - spectra:/shared:rw
    networks:
      - chemotion

  spectra:
    image: ptrxyz/chemotion:spectra-1.9.3
    restart: unless-stopped
    hostname: spectra
    volumes:
      - spectra:/shared:rw
    depends_on:
      - msconvert
    networks:
      - chemotion

  worker:
    image: ptrxyz/chemotion:eln-1.9.3
    restart: unless-stopped
    environment:
      - CONFIG_ROLE=worker
      - SECRET_KEY_BASE=3b4576cc0m927897n56v
      - PUBLIC_URL=https://chemotion.knmf.kit.edu
    depends_on:
      - db
      - eln
      - spectra
    volumes:
      - chemotion_data:/chemotion/data/
      - chemotion_app:/chemotion/app
    networks:
      - chemotion

  eln:
    image: ptrxyz/chemotion:eln-1.9.3
    restart: unless-stopped
    env_file: .env
    environment:
      - CONFIG_ROLE=eln
      - SECRET_KEY_BASE=3b4576cc0m927897n56v
      - PUBLIC_URL=https://chemotion.knmf.kit.edu
    depends_on:
      - db
      - spectra
    volumes:
      - ./shared/pullin:/shared
      - ./shared/backup:/backup
      - chemotion_data:/chemotion/data/
      - chemotion_app:/chemotion/app
    ports:
      - 3579:4000
    networks:
      - chemotion
  ketchersvc:
    image: ptrxyz/chemotion:ketchersvc-1.9.3
    restart: unless-stopped
    init: true
    environment:
      - STARTUPDELAY=30
      - CONFIG_KETCHER_URL=http://eln:4000/ketcher/
    depends_on:
      eln:
        condition: service_healthy
    networks:
      - chemotion

  knmfproposalminer:
    image: mstarman/knmfproposalminer:0.1.3
    env_file:
      - .env
    networks:
      - chemotion

  converter:
    image: ptrxyz/chemotion:converter-1.9.3
    restart: unless-stopped
    environment:
      - SECRET_KEY=3b4576cc0m927897n56v
    volumes:
      - ./services/converter/profiles:/srv/chemotion/profiles
      - ./services/converter/datasets:/srv/chemotion/datasets
      - ./services/converter/htpasswd:/srv/chemotion/htpasswd
      # Please make sure to create htpasswd manually before running this compose file
      # as otherwise docker would create it as a folder. This is not meant to be the case,
      # in fact the file should contain a htpasswd-generated list of users.
      # See the documentation for more information
    networks:
      - chemotion

volumes:
  chemotion_app:
    name: chemotion_app
  chemotion_data:
    name: chemotion_data
  chemotion_db:
    name: chemotion_db
  spectra:
    name: chemotion_spectra

networks:
  chemotion:

