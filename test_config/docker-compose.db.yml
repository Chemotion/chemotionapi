# This docker-compose file sets up the dev DB environment.
#
# USAGE:
# - Run development environment:
#     docker-compose -f docker-compose.db.yml up postgres app webpacker
services:
  postgres:
    image: 'postgres:14'
    environment:
      - 'POSTGRES_PASSWORD=pass'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=chemotion_dev'

    ports: # expose port to host machine in case we want to use external db gui tools
      - '54320:5432'
    volumes:
      - 'db_data:/var/lib/postgresql/data'
volumes:
  db_data: