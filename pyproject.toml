[project]
name = "chemotion-api"
version = "312.0.0"
description = "A Chemotion python API (Pydantic & Chem-DCAT-AP enabled)"
authors = [{ name = "Martin Starman", email = "martin.starman@kit.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.3,<3",
    "python-dateutil>=2.9.0,<3",
    "pytz>=2025.1",
    "python-magic>=0.4.27,<0.5",
    "click>=8.1.7,<9",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.23.0,<5",
    "typing-extensions>=4.12.2,<5",
    "rdflib>=7.1.3,<8",
    "pydantic>=2.0.0,<3",
    # optional progress bar for export_eln(interactive=True); degrades gracefully if absent
    "tqdm>=4.66,<5",
    "chem_dcat_ap>=0.1.0rc3,<0.2.0",  # from PyPI (no longer the local ../chem-dcat-ap path)
    "dcat_ap_plus>=0.1.0rc4,<0.2.0",  # local resolution of the dcat-ap-plus schema import (offline .eln export)
]

[project.scripts]
chemotion_api = "chemotion_api.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-forked>=1.6.0,<2",  # per-test process isolation so heavy tests can't accumulate memory (OOM-safe default)
    "psutil>=6.0.0",
    "pyshacl>=0.31.0",          # chem-dcat-ap SHACL conformance tests
    "mypy>=1.10",               # static type checking
    "ipykernel>=6.0,<7",        # Jupyter kernel for the example notebooks (pinned to v6)
    "ruff>=0.14",
    "pytest-cov>=7",
]
docs = [
    # The runtime/scientific stack is mocked in docs/conf.py, so the docs build without it.
    # Sphinx pinned <9: enum_tools.autoenum is not yet compatible with Sphinx 9.
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2",
    "enum-tools[sphinx]>=0.12",
]

[tool.coverage.run]
source = ["chemotion_api"]

[tool.coverage.report]
# Offline-suite floor (the REST layer is exercised by the integration suite, which is
# not counted here). Measured 55.29% on 2026-07-05 — raise the floor as coverage grows.
fail_under = 55
precision = 1

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# UP (pyupgrade): current-Python idioms (X | None unions, builtin generics, modern super()).
# F (pyflakes): unused imports/variables, f-string misuse, undefined names.
# B (bugbear): likely bugs — exception chaining (B904), mutable defaults, loop-var misuse.
select = ["UP", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# The integration tests use the try/except + `assert False` idiom (B011) and a few blind
# `pytest.raises(Exception)` (B017) against server behaviour that raises varying types.
# pytest runs never use `python -O`, so B011's rationale does not apply here.
"tests/**" = ["B011", "B017"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# New/refactored modules are type-clean. The inherited upstream modules still carry pre-existing
# type issues (tracked, not yet fixed); type-check incrementally rather than failing the whole tree.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemotion_api"]
