[project]
name = "chemotion-api"
version = "400.0.0"
description = "A Chemotion ELN v4 python API"
authors = [{ name = "Martin Starman", email = "martin.starman@kit.edu" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.32.3,<3",
    "python-dateutil>=2.9.0,<3",
    "pytz>=2025.1",
    "python-magic>=0.4.27,<0.5",
    "click>=8.1.7,<9",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.23.0,<5",
    "typing-extensions>=4.12.2,<5",
    # Typed element data (chemotion_api.models) is built on pydantic. The .eln exporter's own
    # dependencies — chem_dcat_ap, dcat_ap_plus, linkml-runtime, tqdm — arrive with the PR that
    # introduces the code importing them.
    "pydantic>=2.0.0,<3",
]

[project.scripts]
chemotion_api = "chemotion_api.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-forked>=1.6.0,<2",  # per-test process isolation so heavy tests can't accumulate memory (OOM-safe default)
    "psutil>=6.0.0",
    "mypy>=1.10",               # static type checking
    "ipykernel>=6.0,<7",        # Jupyter kernel for the example notebooks (pinned to v6)
    "ruff>=0.14",
    "coverage[toml]>=7.6",      # `just cov`; the [tool.coverage.*] config below
]
docs = [
    # autodoc imports the package, so the docs are built in the project environment (`just docs`).
    # Sphinx pinned <9: enum_tools.autoenum is not yet compatible with Sphinx 9.
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2",
    "enum-tools[sphinx]>=0.12",
]

[tool.uv]
# A floor, not a dependency: we never import certifi, it arrives through requests. Earlier
# releases ship the emSign root that was distrusted after the eMudhra key compromise
# (2026-10-20), so a resolve must not quietly pick one up again.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.coverage.run]
source = ["chemotion_api"]

[tool.coverage.report]
# Offline-suite floor (the REST layer is exercised by the integration suite, which is not counted
# here). Measured 62.5% on 2026-09-21 via `just cov` — raise the floor as coverage grows. The
# earlier "55.1%" was never reproducible: coverage was not actually installed until now, and the
# suite's default --forked would have reported 27.7% regardless (see the `cov` recipe).
fail_under = 54
precision = 1

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Modernization only for now: pyupgrade (UP) keeps the code on current-Python idioms
# (X | None unions, builtin generics, modern super() etc.). The inherited upstream
# modules are not yet clean under broader rule sets.
select = ["UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

# Type checking is a ratchet. The whole tree is checked, but the modules listed below still carry
# pre-existing type errors (471 of them across 40 modules when this gate was introduced) and are
# exempted for now; the other 30 modules are enforced from day one and cannot regress.
#
# The list only ever gets shorter: when a change makes a module type-clean, delete its entry in the
# same commit. Never add an entry — that would mean a clean module regressed, which is what this
# gate exists to prevent.
#
# The exemptions are deliberately NOT being cleared up front: roughly half of the outstanding errors
# live in modules that the ELN v4 migration rewrites (collection, elements.sample, elements.reaction,
# elements.abstract_element), so fixing them against the current shape would be discarded work. Each
# module gets cleaned by the change that rewrites it.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
    "chemotion_api",
    "chemotion_api.collection",
    "chemotion_api.commands.updater",
    "chemotion_api.connection",
    "chemotion_api.converter",
    "chemotion_api.element_manager",
    "chemotion_api.elements",
    "chemotion_api.elements.abstract_element",
    "chemotion_api.elements.attachments",
    "chemotion_api.elements.generic_element",
    "chemotion_api.elements.reaction",
    "chemotion_api.elements.research_plan",
    "chemotion_api.elements.sample",
    "chemotion_api.elements.schemas.research_plan",
    "chemotion_api.elements.utils.converter",
    "chemotion_api.elements.utils.equivalent",
    "chemotion_api.elements.wellplate",
    "chemotion_api.elements.workflow_interface",
    "chemotion_api.inbox",
    "chemotion_api.labImotion",
    "chemotion_api.labImotion.base_generic_obj",
    "chemotion_api.labImotion.items.condition_handler",
    "chemotion_api.labImotion.items.fields.abstract_fields",
    "chemotion_api.labImotion.items.fields.base",
    "chemotion_api.labImotion.items.fields.fields",
    "chemotion_api.labImotion.items.fields.sub_fields",
    "chemotion_api.labImotion.items.fields.table_sub_fields",
    "chemotion_api.labImotion.items.genericproperties",
    "chemotion_api.labImotion.items.layer",
    "chemotion_api.labImotion.items.validation.registry",
    "chemotion_api.labImotion.items.validation.schemas.schema_generc_dataset",
    "chemotion_api.labImotion.items.validation.schemas.schema_generc_element",
    "chemotion_api.labImotion.items.validation.schemas.schema_generc_linked_element",
    "chemotion_api.labImotion.items.validation.schemas.schema_generc_segments",
    "chemotion_api.labImotion.structure",
    "chemotion_api.search.reaction",
    "chemotion_api.search.sample",
    "chemotion_api.search.search_helper",
    "chemotion_api.user",
    "chemotion_api.utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemotion_api"]
