[tool.poetry]
name = "chemotion-api"
version = "0.3.4"
description = "A Chemotion python API"
authors = ["Maritn Starman <martin.starman@kit.edu>"]
license = "MIT"
readme = "README.md"

packages = [{include = "chemotion_api"}]

[tool.poetry.dependencies]
python = "^3.09"
requests = "^2.31.0"
python-dateutil = "^2.8.2"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
psutil = "^5.9.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
