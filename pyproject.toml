[project]
name = "chemotion-api"
version = "211.0.1"
description = "A Chemotion python API"
authors = [{ name = "Martin Starman", email = "martin.starman@kit.edu" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "requests>=2.32.3,<3",
    "python-dateutil>=2.9.0,<3",
    "pytz>=2025.1",
    "python-magic>=0.4.27,<0.5",
    "click>=8.1.7,<9",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.23.0,<5",
    "typing-extensions>=4.12.2,<5",
    "rdflib>=7.1.3,<8",
    # chem-dcat-ap, dcat-ap-plus, Pydantic and tqdm are declared by the PR that introduces the
    # exporter code importing them, so this migration declares only what the tree actually uses.
]

[project.scripts]
chemotion_api = "chemotion_api.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-forked>=1.6.0,<2",  # per-test process isolation so heavy tests can't accumulate memory (OOM-safe default)
    "psutil>=6.0.0",
    "mypy>=1.10",               # static type checking
    "ipykernel>=6.0,<7",        # Jupyter kernel for the example notebooks (pinned to v6)
    "ruff>=0.14",
]
docs = [
    # autodoc imports the package, so the docs are built in the project environment (`just docs`).
    # Sphinx pinned <9: enum_tools.autoenum is not yet compatible with Sphinx 9.
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2",
    "enum-tools[sphinx]>=0.12",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Modernization only for now: pyupgrade (UP) keeps the code on current-Python idioms
# (X | None unions, builtin generics, modern super() etc.). The inherited upstream
# modules are not yet clean under broader rule sets.
select = ["UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# New/refactored modules are type-clean. The inherited upstream modules still carry pre-existing
# type issues (tracked, not yet fixed); type-check incrementally rather than failing the whole tree.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemotion_api"]
